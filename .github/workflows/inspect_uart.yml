name: Inspect Leonardo UART source

on:
  push:
    branches: [fix-uart-protocol]
    paths:
      - '.github/workflows/inspect_uart.yml'
      - 'source_bundle.zip'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle
        run: unzip -q source_bundle.zip
      - name: Collect Leonardo source
        run: |
          mkdir -p INSPECT
          cp -a Firmware_Leonardo/brWheel_my INSPECT/
          grep -RniE 'Serial1|115200|0xABCD|ABCD|steer|speed|force|torque|MT6701' Firmware_Leonardo/brWheel_my > INSPECT/uart_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: leonardo-source-inspect
          path: INSPECT
