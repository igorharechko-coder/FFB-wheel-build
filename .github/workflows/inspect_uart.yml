name: Inspect UART sources

on:
  push:
    branches: [fix-uart-protocol]
    paths:
      - '.github/workflows/inspect_uart.yml'
      - 'source_bundle.zip'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle
        run: unzip -q source_bundle.zip
      - name: Collect UART-related source
        run: |
          mkdir -p INSPECT
          cp -a Firmware_Leonardo/brWheel_my INSPECT/
          cp -a Firmware_GD32 INSPECT/
          grep -RniE 'Serial1|115200|0xABCD|ABCD|steer|speed|force|torque|USART|timeout|MOTOR_RIGHT|MOTOR_LEFT|STEER_COEFFICIENT|SPEED_COEFFICIENT' Firmware_Leonardo/brWheel_my Firmware_GD32 > INSPECT/uart_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: uart-source-inspect
          path: INSPECT
