name: Build FFB ready-to-flash firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'source_bundle.zip'
      - '.github/workflows/build_ready.yml'

jobs:
  build-leonardo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source bundle
        run: unzip -q source_bundle.zip

      - uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.6.21

      - name: Apply R5-like baseline tuning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg_h = Path('Firmware_Leonardo/brWheel_my/Config.h')
          s = cfg_h.read_text()
          old = '#define FIRMWARE_VERSION         0xFA'
          new = '#define FIRMWARE_VERSION         0xFB'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('FIRMWARE_VERSION marker not found')
          cfg_h.write_text(s)

          cfg = Path('Firmware_Leonardo/brWheel_my/Config.ino')
          s = cfg.read_text()
          old_block = '''  v8 = 100; //milos, added
          SetParam(PARAM_ADDR_GEN_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_CNT_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_PER_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_STP_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_SPR_GAIN, v8); //milos, added
          v8 = 50; //milos, added
          SetParam(PARAM_ADDR_DMP_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_FRC_GAIN, v8); //milos, added
          SetParam(PARAM_ADDR_INR_GAIN, v8); //milos, added
          v8 = 70; //milos, added
          SetParam(PARAM_ADDR_CTS_GAIN, v8); // milos, added
          '''
          new_block = '''  v8 = 90; // R5-like baseline: strong but leaves clipping headroom
          SetParam(PARAM_ADDR_GEN_GAIN, v8);
          v8 = 100;
          SetParam(PARAM_ADDR_CNT_GAIN, v8);
          SetParam(PARAM_ADDR_PER_GAIN, v8);
          SetParam(PARAM_ADDR_STP_GAIN, v8);
          v8 = 90;
          SetParam(PARAM_ADDR_SPR_GAIN, v8);
          v8 = 25; // light damping: stability without masking detail
          SetParam(PARAM_ADDR_DMP_GAIN, v8);
          v8 = 10; // low friction: preserve small road effects
          SetParam(PARAM_ADDR_FRC_GAIN, v8);
          v8 = 15; // modest inertia: natural wheel mass, quick response
          SetParam(PARAM_ADDR_INR_GAIN, v8);
          v8 = 25; // light desktop centering; games provide their own forces
          SetParam(PARAM_ADDR_CTS_GAIN, v8);
          '''
          if old_block not in s:
              raise SystemExit('Leonardo default tuning block not found')
          s = s.replace(old_block, new_block, 1)
          cfg.write_text(s)

          ino = Path('Firmware_Leonardo/brWheel_my/brWheel_my.ino')
          s = ino.read_text()
          replacements = {
              '  configGeneralGain = 100;': '  configGeneralGain = 90;',
              '  configDamperGain = 50;': '  configDamperGain = 25;',
              '  configFrictionGain = 50;': '  configFrictionGain = 10;',
              '  configSpringGain = 50;': '  configSpringGain = 90;',
              '  configInertiaGain = 50;': '  configInertiaGain = 15;',
              '  configCenterGain = 70;': '  configCenterGain = 25;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Fallback tuning marker not found: {old}')
              s = s.replace(old, new, 1)
          ino.write_text(s)
          PY

      - name: Fix Linux include case
        run: |
          grep -RIl '#include <arduino.h>' Firmware_Leonardo | xargs -r sed -i 's/#include <arduino.h>/#include <Arduino.h>/g'

      - name: Apply modified Arduino core
        run: |
          CORE="$HOME/.arduino15/packages/arduino/hardware/avr/1.6.21/cores"
          mv "$CORE/arduino" "$CORE/arduino_org"
          cp -a Firmware_Leonardo/arduino-1.8.5/hardware/arduino/cores/arduino "$CORE/arduino"
          cp "$CORE/arduino_org/IPAddress.cpp" "$CORE/arduino/"
          cp "$CORE/arduino_org/IPAddress.h" "$CORE/arduino/"
          cp "$CORE/arduino_org/new.cpp" "$CORE/arduino/"
          cp "$CORE/arduino_org/new.h" "$CORE/arduino/"

      - name: Install bundled libraries
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp -a Firmware_Leonardo/arduino-1.8.5/libraries/. "$HOME/Arduino/libraries/"
          arduino-cli lib install "HX711_ADC"
          sed -i '/^[[:space:]]*yield();[[:space:]]*$/d' "$HOME/Arduino/libraries/HX711_ADC/src/HX711_ADC.cpp"

      - name: Compile Leonardo
        run: |
          mkdir -p build_leonardo READY_TO_FLASH
          arduino-cli compile \
            --fqbn arduino:avr:leonardo \
            Firmware_Leonardo/brWheel_my \
            --build-path "$PWD/build_leonardo" \
            --libraries "$HOME/Arduino/libraries"
          HEX=$(find build_leonardo -maxdepth 1 -name '*.hex' ! -name '*with_bootloader*' | head -n1)
          test -n "$HEX"
          cp "$HEX" READY_TO_FLASH/Leonardo_FFB_MT6701.hex

      - uses: actions/upload-artifact@v4
        with:
          name: Leonardo_FFB_MT6701
          path: READY_TO_FLASH/Leonardo_FFB_MT6701.hex

  build-gd32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source bundle
        run: unzip -q source_bundle.zip

      - name: Apply R5-like motor-side smoothing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Firmware_GD32/Inc/config.h')
          s = p.read_text()
          old = '#define DEFAULT_FILTER              65535 // FFB: no additional input low-pass smoothing'
          new = '#define DEFAULT_FILTER              58982 // FFB baseline: ~0.90, very light smoothing with low added latency'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('DEFAULT_FILTER marker not found')
          p.write_text(s)
          PY

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile GD32
        working-directory: Firmware_GD32
        run: |
          make clean || true
          make -e VARIANT=VARIANT_USART
          test -f build/hover.bin
          test -f build/hover.hex

      - name: Collect GD32 files
        run: |
          mkdir -p READY_TO_FLASH
          cp Firmware_GD32/build/hover.bin READY_TO_FLASH/GD32_FOC_24V_RIGHT.bin
          cp Firmware_GD32/build/hover.hex READY_TO_FLASH/GD32_FOC_24V_RIGHT.hex

      - uses: actions/upload-artifact@v4
        with:
          name: GD32_FOC_24V_RIGHT
          path: |
            READY_TO_FLASH/GD32_FOC_24V_RIGHT.bin
            READY_TO_FLASH/GD32_FOC_24V_RIGHT.hex
