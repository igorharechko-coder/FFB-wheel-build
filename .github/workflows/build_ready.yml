name: Build FFB ready-to-flash firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'source_bundle.zip'
      - '.github/workflows/build_ready.yml'
      - 'patch_stable.py'

jobs:
  build-leonardo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source bundle
        run: unzip -q source_bundle.zip

      - uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.6.21

      - name: Inspect MT6701 compatibility source
        shell: bash
        run: |
          echo "=== MT6701Compat.h ==="
          cat Firmware_Leonardo/brWheel_my/MT6701Compat.h

      - name: Invert MT6701 steering direction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Firmware_Leonardo/brWheel_my/brWheel_my.ino')
          s = p.read_text()
          old = 'turn.x = as5600x.getCumulativePosition() - ROTATION_MID; // milos, AS5600 angle readout'
          new = 'turn.x = ROTATION_MID - as5600x.getCumulativePosition(); // MT6701 steering direction inverted'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('MT6701 steering readout marker not found')
          p.write_text(s)
          print('Applied MT6701 steering inversion')
          PY

      - name: Apply R5-like baseline tuning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg_h = Path('Firmware_Leonardo/brWheel_my/Config.h')
          s = cfg_h.read_text()
          s, n = re.subn(r'#define FIRMWARE_VERSION\s+0xFA', '#define FIRMWARE_VERSION         0xFB', s, count=1)
          if n != 1 and 'FIRMWARE_VERSION         0xFB' not in s:
              raise SystemExit('FIRMWARE_VERSION marker not found')
          cfg_h.write_text(s)

          cfg = Path('Firmware_Leonardo/brWheel_my/Config.ino')
          s = cfg.read_text()
          gains = {
              'GEN': 100,
              'CNT': 100,
              'PER': 100,
              'STP': 100,
              'SPR': 90,
              'DMP': 20,
              'FRC': 20,
              'INR': 25,
              'CTS': 25,
          }
          for key, value in gains.items():
              pat = rf'(^\s*)SetParam\(PARAM_ADDR_{key}_GAIN, v8\);[^\n]*'
              repl = rf'\1v8 = {value};\n\1SetParam(PARAM_ADDR_{key}_GAIN, v8);'
              s, n = re.subn(pat, repl, s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'Gain marker not found: {key}')
          cfg.write_text(s)

          ino = Path('Firmware_Leonardo/brWheel_my/brWheel_my.ino')
          s = ino.read_text()
          replacements = {
              'configGeneralGain': 100,
              'configDamperGain': 20,
              'configFrictionGain': 20,
              'configSpringGain': 90,
              'configInertiaGain': 25,
              'configCenterGain': 25,
          }
          for name, value in replacements.items():
              s, n = re.subn(rf'(^\s*{name}\s*=\s*)\d+(;)', rf'\g<1>{value}\2', s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'Fallback tuning marker not found: {name}')
          ino.write_text(s)
          PY

      - name: Configure direct 2 pedals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Firmware_Leonardo/brWheel_my/brWheel_my.ino')
          t = p.read_text()
          marker = 'button = readInputButtons(); // milos, read all buttons including matrix and hat switch'
          replacement = """accel.val = constrain(map(analogRead(A0), 32, 449, 0, Z_AXIS_PHYS_MAX), 0L, (long)Z_AXIS_PHYS_MAX);
          brake.val = 0;\n          clutch.val = constrain(map(analogRead(A2), 0, 353, 0, RX_AXIS_PHYS_MAX), 0L, (long)RX_AXIS_PHYS_MAX);
          // clutch field repurposed for brake on RX axis
          hbrake.val = 0;
          button = 0; // 2-pedal diagnostic"""
          if marker not in t:
              raise SystemExit('Input-report marker not found')
          t = t.replace(marker, replacement, 1)
          p.write_text(t)
          print('2 pedals exact calibrated: A0 32-449 gas on Z, A2 0-353 brake on RX; Y neutral; buttons off')
          PY


      - name: Apply stability patch
        run: python3 patch_stable.py

      - name: Fix Linux include case
        run: |
          grep -RIl '#include <arduino.h>' Firmware_Leonardo | xargs -r sed -i 's/#include <arduino.h>/#include <Arduino.h>/g'

      - name: Apply modified Arduino core
        run: |
          CORE="$HOME/.arduino15/packages/arduino/hardware/avr/1.6.21/cores"
          mv "$CORE/arduino" "$CORE/arduino_org"
          cp -a Firmware_Leonardo/arduino-1.8.5/hardware/arduino/cores/arduino "$CORE/arduino"
          cp "$CORE/arduino_org/IPAddress.cpp" "$CORE/arduino/"
          cp "$CORE/arduino_org/IPAddress.h" "$CORE/arduino/"
          cp "$CORE/arduino_org/new.cpp" "$CORE/arduino/"
          cp "$CORE/arduino_org/new.h" "$CORE/arduino/"

      - name: Install bundled libraries
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp -a Firmware_Leonardo/arduino-1.8.5/libraries/. "$HOME/Arduino/libraries/"
          arduino-cli lib install "HX711_ADC"
          sed -i '/^[[:space:]]*yield();[[:space:]]*$/d' "$HOME/Arduino/libraries/HX711_ADC/src/HX711_ADC.cpp"

      - name: Compile Leonardo
        run: |
          mkdir -p build_leonardo READY_TO_FLASH
          arduino-cli compile \
            --fqbn arduino:avr:leonardo \
            Firmware_Leonardo/brWheel_my \
            --build-path "$PWD/build_leonardo" \
            --libraries "$HOME/Arduino/libraries"
          HEX=$(find build_leonardo -maxdepth 1 -name '*.hex' ! -name '*with_bootloader*' | head -n1)
          test -n "$HEX"
          cp "$HEX" READY_TO_FLASH/Leonardo_FFB_R5_CHARACTER.hex

      - uses: actions/upload-artifact@v4
        with:
          name: Leonardo_FFB_R5_CHARACTER
          path: READY_TO_FLASH/Leonardo_FFB_R5_CHARACTER.hex

  build-gd32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source bundle
        run: unzip -q source_bundle.zip

      - name: Apply R5-like motor-side smoothing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Firmware_GD32/Inc/config.h')
          s = p.read_text()
          old = '#define DEFAULT_FILTER              65535 // FFB: no additional input low-pass smoothing'
          new = '#define DEFAULT_FILTER              62258 // R5-character: ~0.95, less smoothing for stronger road/kerb detail'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('DEFAULT_FILTER marker not found')
          p.write_text(s)
          PY

      - name: Inspect and disable direction beep
        shell: bash
        run: |
          echo "=== beep-related definitions/usages ==="
          grep -RniE "BEEP|BUZZ|BACKWARD|REVERSE" Firmware_GD32/Inc Firmware_GD32/Src | head -n 200 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed = 0
          patterns = [
              (r'(#define\s+BEEPS_BACKWARD\s+)1\b', r'\g<1>0'),
              (r'(#define\s+BEEP_BACKWARD\s+)1\b', r'\g<1>0'),
              (r'(#define\s+BACKWARD_BEEP\s+)1\b', r'\g<1>0'),
              (r'(#define\s+BACKWARD_BEEPS\s+)1\b', r'\g<1>0'),
          ]
          for p in Path('Firmware_GD32').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  txt = p.read_text()
              except Exception:
                  continue
              old = txt
              for pat, rep in patterns:
                  txt = re.sub(pat, rep, txt)
              if txt != old:
                  p.write_text(txt)
                  print('Disabled direction beep in', p)
                  changed += 1
          print('direction-beep files changed:', changed)
          PY

      - name: Inspect idle poweroff logic
        shell: bash
        run: |
          echo "=== idle/poweroff related source ==="
          grep -RniE "idle|inactiv|power.?off|poweroff|shutdown|timeout.*power|button.*off|off.*timeout" Firmware_GD32/Inc Firmware_GD32/Src | head -n 300 || true

      - name: Disable idle auto poweroff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Firmware_GD32/Src/main.c')
          s = p.read_text()
          old = 'if (inactivity_timeout_counter > (INACTIVITY_TIMEOUT * 60 * 1000) / (DELAY_IN_MAIN_LOOP + 1)) {'
          new = 'if (0 && inactivity_timeout_counter > (INACTIVITY_TIMEOUT * 60 * 1000) / (DELAY_IN_MAIN_LOOP + 1)) { // FFB: idle auto-poweroff disabled'
          if old not in s:
              raise SystemExit('Idle poweroff condition not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Disabled inactivity auto-poweroff; button and safety poweroff remain active')
          PY

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile GD32
        working-directory: Firmware_GD32
        run: |
          make clean || true
          make -e VARIANT=VARIANT_USART
          test -f build/hover.bin
          test -f build/hover.hex

      - name: Collect GD32 files
        run: |
          mkdir -p READY_TO_FLASH
          cp Firmware_GD32/build/hover.bin READY_TO_FLASH/GD32_FOC_24V_R5_CHARACTER_NO_IDLE_POWEROFF.bin
          cp Firmware_GD32/build/hover.hex READY_TO_FLASH/GD32_FOC_24V_R5_CHARACTER_NO_IDLE_POWEROFF.hex

      - uses: actions/upload-artifact@v4
        with:
          name: GD32_FOC_24V_R5_CHARACTER_NO_IDLE_POWEROFF
          path: |
            READY_TO_FLASH/GD32_FOC_24V_R5_CHARACTER_NO_IDLE_POWEROFF.bin
            READY_TO_FLASH/GD32_FOC_24V_R5_CHARACTER_NO_IDLE_POWEROFF.hex
